<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>EmotionFlow CRM</title>
    <!-- SPA shell: static SEO pages live under /seo/ (see npm run generate:seo) -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Track your expenses and emotions." />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EmotionFlow" />
    <meta
      property="og:description"
      content="Track emotions, budgets and goals in one place"
    />
    <meta property="og:url" content="https://emotionflow.uz/" />
    <meta property="og:image" content="https://emotionflow.uz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EmotionFlow" />
    <meta
      name="twitter:description"
      content="Track emotions, budgets and goals in one place"
    />
    <meta name="twitter:image" content="https://emotionflow.uz/og-image.png" />
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="EmotionFlow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
